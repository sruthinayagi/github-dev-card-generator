[project]
name = "github-dev-card-backend"
version = "0.1.0"
description = "Backend for GitHub Dev Card Generator"
dependencies = [
    "fastapi",
    "uvicorn",
    "mcp",
    "google-adk",
    "python-dotenv",
    "httpx",
    "google-generativeai",
    "jinja2",
    "openai",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
